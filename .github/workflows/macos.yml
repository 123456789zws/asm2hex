name: macOS 构建 (macOS Build)

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Go 环境 (Set up Go)
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'

    - name: 安装依赖 (macOS) (Install dependencies (macOS))
      run: |
        brew install capstone keystone
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: 构建项目 (Build project)
      run: |
        set -euo pipefail
        PREFIX="$(brew --prefix)"
        export CGO_ENABLED=1
        export CGO_CFLAGS="-I${PREFIX}/include -O2 -Wall"
        export CGO_LDFLAGS="-L${PREFIX}/lib -lcapstone -lkeystone -lstdc++ -Wl,-rpath,${PREFIX}/lib"
        go version
        mkdir -p build release
        go build -trimpath -ldflags="-s -w" -o "build/asm2hex" .

        # Package as .app with Dock/Finder icon
        chmod +x scripts/build_macos_app.sh
        scripts/build_macos_app.sh "build/asm2hex" "build/ASM to HEX Converter.app"
        test -d "build/ASM to HEX Converter.app"
        test -f "build/ASM to HEX Converter.app/Contents/Resources/AppIcon.icns"

        # Zip the .app (and optional dylibs for offline use)
        mkdir -p release
        ditto -c -k --sequesterRsrc --keepParent \
          "build/ASM to HEX Converter.app" \
          "release/asm2hex-macos.zip"

        # Best-effort: also ship dylibs next to the zip for non-app use
        mkdir -p release/lib
        for lib in libkeystone libcapstone; do
          if ls "${PREFIX}/lib/${lib}"*.dylib >/dev/null 2>&1; then
            cp "${PREFIX}/lib/${lib}"*.dylib release/lib/ || true
          fi
        done
        ls -lah release/
        ls -lah "build/ASM to HEX Converter.app/Contents/MacOS/"
        ls -lah "build/ASM to HEX Converter.app/Contents/Resources/"

    - name: 上传构建产物 (Upload Build Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          ./release/*.zip
        if-no-files-found: error
