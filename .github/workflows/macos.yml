name: macOS 构建 (macOS Build)

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Go 环境 (Set up Go)
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'

    - name: 安装依赖 (macOS) (Install dependencies (macOS))
      run: |
        brew install capstone keystone
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: 构建项目 (Build project)
      run: |
        set -euo pipefail
        PREFIX="$(brew --prefix)"
        export CGO_ENABLED=1
        export CGO_CFLAGS="-I${PREFIX}/include -O2 -Wall"
        export CGO_LDFLAGS="-L${PREFIX}/lib -lcapstone -lkeystone -lstdc++ -Wl,-rpath,${PREFIX}/lib"
        go version
        mkdir -p build release
        go build -trimpath -ldflags="-s -w" -o "build/asm2hex" .
        # Stage a portable zip with the binary
        cp build/asm2hex release/
        # Try to include dylibs for offline use (best-effort)
        mkdir -p release/lib
        for lib in libkeystone libcapstone; do
          if ls "${PREFIX}/lib/${lib}"*.dylib >/dev/null 2>&1; then
            cp "${PREFIX}/lib/${lib}"*.dylib release/lib/ || true
          fi
        done
        (cd release && zip -r ../asm2hex-macos.zip .)
        mv asm2hex-macos.zip release/
        ls -lah release/

    - name: 上传构建产物 (Upload Build Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          ./release/*.zip
        if-no-files-found: error
