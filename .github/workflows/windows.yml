name: Windows 构建 (Windows Build)

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: mingw64 }

    name: 🚧${{ matrix.icon }} ${{ matrix.sys }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          zip
        pacboy: >-
          toolchain:p
          go:p
          keystone:p
          capstone:p

    - name: '🏗️ Build project'
      run: |
        set -e
        export PATH="$(go env GOPATH)/bin:$(go env GOROOT)/bin:$PATH"
        export CGO_ENABLED=1
        export CGO_CFLAGS="-I${MSYSTEM_PREFIX}/include -O2 -Wall"
        # Prefer static archives when present; always link C++ runtime for Keystone.
        export CGO_LDFLAGS="-L${MSYSTEM_PREFIX}/lib -lcapstone -lkeystone -lstdc++ -lole32 -lshell32 -lkernel32 -lversion -luuid"
        go version
        mkdir -p build release
        go build -trimpath -ldflags="-s -w" -o "build/ASM to HEX Converter.exe" .
        # Bundle runtime DLLs so the zip is portable outside MSYS2.
        for dll in libkeystone libcapstone libgcc_s_seh-1 libstdc++-6 libwinpthread-1; do
          if [ -f "${MSYSTEM_PREFIX}/bin/${dll}.dll" ]; then
            cp "${MSYSTEM_PREFIX}/bin/${dll}.dll" build/
          fi
        done
        # Common dependency DLLs used by mingw packages
        for dll in $(ldd "build/ASM to HEX Converter.exe" | awk '/\/mingw64\/bin\// {print $3}'); do
          cp -n "$dll" build/ || true
        done
        cp build/* release/
        (cd release && zip -r "../asm2hex-windows-${{ matrix.sys }}.zip" .)
        mv "asm2hex-windows-${{ matrix.sys }}.zip" release/
        ls -lah release/

    - name: '🚀 Upload Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.sys }}-build
        path: |
          ./release/*.zip
        if-no-files-found: error
