name: Windows 构建 (Windows Build)

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: mingw64 }

    name: 🚧${{ matrix.icon }} ${{ matrix.sys }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          zip
          binutils
        pacboy: >-
          toolchain:p
          go:p
          keystone:p
          capstone:p

    - name: '🏗️ Build fully static GUI binary'
      run: |
        set -e
        export PATH="$(go env GOPATH)/bin:$(go env GOROOT)/bin:$PATH"
        export CGO_ENABLED=1
        export CGO_CFLAGS="-I${MSYSTEM_PREFIX}/include -O2 -Wall"

        echo "=== library files (prefer .a static archives) ==="
        ls -la "${MSYSTEM_PREFIX}/lib"/libkeystone* "${MSYSTEM_PREFIX}/lib"/libcapstone* || true

        # Force the linker to use static archives for engines + C++ runtime.
        # Windows system libs (kernel32, user32, ...) remain dynamic imports — that is expected.
        export CGO_LDFLAGS="-L${MSYSTEM_PREFIX}/lib -Wl,-Bstatic -lcapstone -lkeystone -lstdc++ -lwinpthread -Wl,-Bdynamic -lm -lole32 -lshell32 -lkernel32 -lversion -luuid -lwinmm -lgdi32 -luser32 -lopengl32 -ldwmapi -lcomdlg32 -lcomctl32 -limm32"

        go version
        mkdir -p build release

        # -H windowsgui: hide console
        # -extldflags: fully static-link libgcc/libstdc++ (no MinGW runtime DLLs)
        go build -trimpath \
          -ldflags="-s -w -H windowsgui -extldflags=-static-libgcc -extldflags=-static-libstdc++" \
          -o "build/ASM to HEX Converter.exe" .

        # If any mingw/engine DLL remains, retry with full -static
        BAD=$(objdump -p "build/ASM to HEX Converter.exe" | grep -iE "DLL Name.*(libgcc|libstdc|libwinpthread|libkeystone|libcapstone|msys-)" || true)
        if [ -n "$BAD" ]; then
          echo "First link still has non-system DLLs, retrying with -static:"
          echo "$BAD"
          go build -trimpath \
            -ldflags="-s -w -H windowsgui -extldflags=-static" \
            -o "build/ASM to HEX Converter.exe" .
        fi

        echo "=== PE imported DLLs (Windows system only is OK) ==="
        objdump -p "build/ASM to HEX Converter.exe" | grep -i "DLL Name" || true

        BAD=$(objdump -p "build/ASM to HEX Converter.exe" | grep -iE "DLL Name.*(libgcc|libstdc|libwinpthread|libkeystone|libcapstone|msys-)" || true)
        if [ -n "$BAD" ]; then
          echo "ERROR: binary still depends on MinGW/engine DLLs:"
          echo "$BAD"
          exit 1
        fi

        # Single-file release (no companion DLLs)
        cp "build/ASM to HEX Converter.exe" release/
        (cd release && zip -r "../asm2hex-windows-${{ matrix.sys }}.zip" .)
        mv "asm2hex-windows-${{ matrix.sys }}.zip" release/
        ls -lah release/
        ls -lah "build/ASM to HEX Converter.exe"

    - name: '🚀 Upload Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.sys }}-build
        path: |
          ./release/*.zip
        if-no-files-found: error
