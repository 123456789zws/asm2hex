name: Windows 构建 (Windows Build)

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Uploaded artifact name"
        value: windows-mingw64-build

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: mingw64 }

    name: 🚧${{ matrix.icon }} ${{ matrix.sys }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          go:p
          7zip:p

    - name: '🚧 Install Fyne'
      run: |
        export PATH="$(go env GOPATH)/bin:$(go env GOROOT)/bin:$PATH"
        go install fyne.io/fyne/v2/cmd/fyne@v2.4.5
        cp "$(go env GOPATH)/bin/fyne.exe" "$MSYSTEM_PREFIX/bin/"

    - name: '📦 Build Capstone and Keystone libraries'
      run: |
        export PATH="$(go env GOPATH)/bin:$(go env GOROOT)/bin:$PATH"
        make lib

    - name: '🏗️ Build project'
      run: |
        export PATH="$(go env GOPATH)/bin:$(go env GOROOT)/bin:$PATH"
        export CGO_ENABLED=1
        make build

    - name: '📁 Compress Release Asset (Windows)'
      run: |
        mkdir -p release
        cp ./build/*.exe ./release/
        7z a -tzip "asm2hex-windows-${{ matrix.sys }}.zip" ./release/*
        mv "asm2hex-windows-${{ matrix.sys }}.zip" ./release/

    - name: '🚀 Upload Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.sys }}-build
        path: |
          ./release/*.zip
          ./release/*.exe
        if-no-files-found: error
