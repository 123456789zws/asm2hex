name: Windows 构建 (Windows Build)

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: mingw64 }

    name: 🚧${{ matrix.icon }} ${{ matrix.sys }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          zip
          binutils
          patch
          python
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          go:p
          capstone:p

    - name: '📦 Build static Keystone (MSYS2 only ships import lib)'
      run: |
        set -e
        LOCAL_PREFIX="$(pwd)/third_party/prefix"
        mkdir -p "$LOCAL_PREFIX"

        git clone --depth 1 --branch 0.9.2 https://github.com/keystone-engine/keystone.git tmp/keystone
        cd tmp/keystone

        # Patch for CMake 4+: raise minimum version and drop removed OLD policies
        find . -name 'CMakeLists.txt' -print0 | xargs -0 sed -i \
          -e 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.16)/g' \
          -e 's/cmake_policy(SET CMP0051 OLD)/cmake_policy(SET CMP0051 NEW)/g' \
          -e 's/cmake_policy(SET CMP0012 OLD)/cmake_policy(SET CMP0012 NEW)/g'

        # Prefer static runtime embedding when available
        cmake -S . -B build -G Ninja \
          -DCMAKE_INSTALL_PREFIX="$LOCAL_PREFIX" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_LIBS_ONLY=ON \
          -DKEYSTONE_BUILD_STATIC_RUNTIME=ON \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.16 \
          -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++"

        cmake --build build --config Release --parallel
        cmake --install build

        echo "=== installed keystone ==="
        ls -la "$LOCAL_PREFIX/lib" || true
        ls -la "$LOCAL_PREFIX/include/keystone" || true
        test -f "$LOCAL_PREFIX/lib/libkeystone.a" || test -f "$LOCAL_PREFIX/lib/keystone.lib" || {
          # Some installs name it differently
          find "$LOCAL_PREFIX" -name '*keystone*' -type f
          exit 1
        }

    - name: '🏗️ Build fully static GUI binary'
      run: |
        set -e
        export PATH="$(go env GOPATH)/bin:$(go env GOROOT)/bin:$PATH"
        LOCAL_PREFIX="$(pwd)/third_party/prefix"
        export CGO_ENABLED=1
        # Capstone: MSYS2 static .a; Keystone: our static build
        export CGO_CFLAGS="-I${LOCAL_PREFIX}/include -I${MSYSTEM_PREFIX}/include -O2 -Wall"
        export CGO_LDFLAGS="-L${LOCAL_PREFIX}/lib -L${MSYSTEM_PREFIX}/lib -Wl,-Bstatic -lkeystone -lcapstone -lstdc++ -lwinpthread -Wl,-Bdynamic -lm -lole32 -lshell32 -lkernel32 -lversion -luuid -lwinmm -lgdi32 -luser32 -lopengl32 -ldwmapi -lcomdlg32 -lcomctl32 -limm32"

        go version
        mkdir -p build release

        go build -trimpath \
          -ldflags="-s -w -H windowsgui -extldflags=-static-libgcc -extldflags=-static-libstdc++" \
          -o "build/ASM to HEX Converter.exe" .

        echo "=== PE imported DLLs ==="
        objdump -p "build/ASM to HEX Converter.exe" | grep -i "DLL Name" || true

        BAD=$(objdump -p "build/ASM to HEX Converter.exe" | grep -iE "DLL Name.*(libgcc|libstdc|libwinpthread|libkeystone|libcapstone|msys-)" || true)
        if [ -n "$BAD" ]; then
          echo "Retry with full -static..."
          go build -trimpath \
            -ldflags="-s -w -H windowsgui -extldflags=-static" \
            -o "build/ASM to HEX Converter.exe" .
          echo "=== PE imported DLLs (after -static) ==="
          objdump -p "build/ASM to HEX Converter.exe" | grep -i "DLL Name" || true
          BAD=$(objdump -p "build/ASM to HEX Converter.exe" | grep -iE "DLL Name.*(libgcc|libstdc|libwinpthread|libkeystone|libcapstone|msys-)" || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: binary still depends on MinGW/engine DLLs:"
            echo "$BAD"
            exit 1
          fi
        fi

        cp "build/ASM to HEX Converter.exe" release/
        (cd release && zip -r "../asm2hex-windows-${{ matrix.sys }}.zip" .)
        mv "asm2hex-windows-${{ matrix.sys }}.zip" release/
        ls -lah release/
        ls -lah "build/ASM to HEX Converter.exe"

    - name: '🚀 Upload Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.sys }}-build
        path: |
          ./release/*.zip
        if-no-files-found: error
